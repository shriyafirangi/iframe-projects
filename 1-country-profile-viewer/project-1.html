<!DOCTYPE html>
<html>
	<head>
		<title>
			iframe-task
		</title>
		<link rel="stylesheet" href="style.css">
		
		<meta charset="UTF-8">
		<meta name="author" content="Shriya Firangi">
		<meta name="description" content="An interactive web page showcasing country profiles using HTML iframes.">
		<meta name="keywords" content="html, iframe, frontend">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		
	</head>
	<body>
		<nav class="nav">
			<div class="center bold-text">Wikipedia Collections</div>
		</nav>
		
		<div class="box left">
			<div class="center bold-text sub-text gap-11">Country Name</div>
				<a href="https://en.wikipedia.org/wiki/Austria" target="myframe" class="anchor">
					<div class="box3 align" style="margin-top:10%">
						<img src="images/austria.avif" height="18px" class="block left gap-left gap1">
						<p class="zero center bold-text left gap1 gap-left">
							Austria
						</p>
					</div>
				</a>
			<a href="https://en.wikipedia.org/wiki/India" target="myframe" class="anchor">
					<div class="box3 align" style="margin-top:7%">
						<img src="images/india.avif" height="18px" class="block left gap-left gap1">
						<p class="zero center bold-text left gap1 gap-left">
							India
						</p>
					</div>
			</a>
			<a href="https://en.wikipedia.org/wiki/Spain" target="myframe" class="anchor">
				<div class="box3 align" style="margin-top:7%">
					<img src="images/spain.avif" height="18px" class="block left gap-left gap1">
					<p class="zero center bold-text left gap1 gap-left">
						Spain
					</p>
				</div>
			</a>
			
			<a href="https://en.wikipedia.org/wiki/France" target="myframe" class="anchor">
				<div class="box3 align" style="margin-top:7%">
					<img src="images/france.avif" height="18px" class="block left gap-left gap1">
					<p class="zero center bold-text left gap1 gap-left">
						France
					</p>
				</div>
			</a>
			
			<a href="https://en.wikipedia.org/wiki/Italy" target="myframe" class="anchor">
				<div class="box3 align" style="margin-top:7%">
					<img src="images/italy.avif" height="18px" class="block left gap-left gap1">
					<p class="zero center bold-text left gap1 gap-left">
						Italy
					</p>
				</div>
			</a>
		</div>
		
		<div class="box2 left">
			<div class="center bold-text sub-text gap-12">Country Information</div>
			
			<iframe src="" name="myframe" frameborder="0" class="frame align">
			</iframe>
		</div>
	</body>
</html>
