<!DOCTYPE HTML>
<html>
	<head>
		<title>
			iframe2
		</title>
		<link rel="stylesheet" href="style.css">
		
		<meta charset="UTF-8">
		<meta name="author" content="Shriya Firangi">
		<meta name="description" content="An interactive web page showcasing country profiles using HTML iframes.">
		<meta name="keywords" content="html, iframe, frontend">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		
	</head>
	<body class="body">
		<nav class="nav" style="background: linear-gradient(45deg, #ffd89b 0%, #19547b 100%);">
			<p class=" zero center bold-text">World Profiles</p>
		</nav>
		<div class="sec zero">
			<div class="word align">
			<iframe src="" name="myframe" frameborder="0" class="frame gap1">
			</iframe>
			</div>
		</div>
		
		<div class="sec1">
			<div class="word align">
				<a href="https://en.wikipedia.org/wiki/Austria" target="myframe" class="anchor">
					<div class="box1 desert left">
						<p class="zero gap center sub-text bold-text">AUSTRIA</p>
						<iframe src="https://en.wikipedia.org/wiki/Austria" frameborder="0" class="frame1 align">
						</iframe>
					</div>
				</a>
				
				<a href="https://en.wikipedia.org/wiki/India" target="myframe" class="anchor">
					<div class="box1 desert left" >
						<p class="zero gap center sub-text bold-text">INDIA</p>
						<iframe src="https://en.wikipedia.org/wiki/India" frameborder="0" class="frame1 align">
						</iframe>
					</div>
				</a>
				<a href="https://en.wikipedia.org/wiki/Spain" target="myframe" class="anchor">
					<div class="box1 desert left">
						<p class="zero gap center sub-text bold-text">SPAIN</p>
						<iframe src="https://en.wikipedia.org/wiki/Spain" frameborder="0" class="frame1 align">
						</iframe>
					</div>
				</a>
			</div>
			<div class="word align">
				<a href="https://en.wikipedia.org/wiki/France" target="myframe" class="anchor">
					<div class="box1 desert left">
						<p class="zero gap center sub-text bold-text">FRANCE</p>
						<iframe src="https://en.wikipedia.org/wiki/Austria" frameborder="0" class="frame1 align">
						</iframe>
					</div>
				</a>
				<a href="https://en.wikipedia.org/wiki/Italy" target="myframe" class="anchor">
					<div class="box1 desert left">
						<p class="zero gap center sub-text bold-text">ITALY</p>
						<iframe src="https://en.wikipedia.org/wiki/Austria" frameborder="0" class="frame1 align">
						</iframe>
					</div>
				</a>
			</div>
			
			
		</div>
		
	</body>
</html>
